[project]
name = "mars"
version = "0.1.0"
description = "Multi-Attribute Rotation Scheme (Alvarez et al., 2015) for petrophysical prediction from elastic attributes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kevin Raihan Yassin" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lasio>=0.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
seismic = ["segyio>=1.9.12", "xarray>=2024.1", "zarr>=2.17"]
viz3d = ["pyvista>=0.43"]
gpu = ["cupy-cuda12x>=13"]  # optional: GTX 1050 Ti (CC 6.1); smoothing in mars.seismic_apply
notebook = ["jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the real well data (MARS_DATA_DIR); skipped when absent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # one-off CLI tools; long log/f-string lines are fine there
"paper/*" = ["E501"]  # table/figure generators: long LaTeX strings
